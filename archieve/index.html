<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meditör - Zengin Metin Editörü</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Özel CSS -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/image-styles.css">
    <link rel="stylesheet" href="css/table-styles.css">
    <style>
        /* Kritik düzeltmeler direkt olarak burada */
        .resize-handles {
            position: absolute !important;
            box-sizing: border-box !important;
            pointer-events: none !important;
            border: 1px dashed #0d6efd !important;
            margin: 0 !important;
            padding: 0 !important;
        }
        
        /* Editör içerisindeki position:relative olan elementleri düzelt */
        #editor {
            position: relative !important;
        }
        
        #editor img {
            max-width: 100%;
            height: auto;
        }
        
        /* Resim düzenleme göstergelerini iyileştir */
        .selected-image {
            outline: 2px solid #0d6efd !important;
            outline-offset: 1px !important;
        }
        
       
    </style>
</head>
<body>
    <div class="container my-5">
        <div class="row">
            <div class="col-12">
                <h2 class="text-center mb-4">Meditör - Zengin Metin Editörü</h2>
                
                <div class="card" id="editor-container">
                    <div class="card-header bg-light">
                        <div class="btn-toolbar" role="toolbar">
                            <!-- Format Seçenekleri -->
                            <div class="btn-group me-2" role="group">
                                <button type="button" class="btn btn-outline-secondary" id="btn-bold" title="Kalın">
                                    <i class="fas fa-bold"></i>
                                </button>
                                <button type="button" class="btn btn-outline-secondary" id="btn-italic" title="İtalik">
                                    <i class="fas fa-italic"></i>
                                </button>
                                <button type="button" class="btn btn-outline-secondary" id="btn-underline" title="Altı Çizili">
                                    <i class="fas fa-underline"></i>
                                </button>
                                <button type="button" class="btn btn-outline-secondary" id="btn-strikethrough" title="Üstü Çizili">
                                    <i class="fas fa-strikethrough"></i>
                                </button>
                            </div>
                            
                            <!-- Metin Hizalama -->
                            <div class="btn-group me-2" role="group">
                                <button type="button" class="btn btn-outline-secondary" id="btn-align-left" title="Sola Hizala">
                                    <i class="fas fa-align-left"></i>
                                </button>
                                <button type="button" class="btn btn-outline-secondary" id="btn-align-center" title="Ortala">
                                    <i class="fas fa-align-center"></i>
                                </button>
                                <button type="button" class="btn btn-outline-secondary" id="btn-align-right" title="Sağa Hizala">
                                    <i class="fas fa-align-right"></i>
                                </button>
                                <button type="button" class="btn btn-outline-secondary" id="btn-align-justify" title="İki Yana Yasla">
                                    <i class="fas fa-align-justify"></i>
                                </button>
                            </div>
                            
                            <!-- Liste Biçimlendirme -->
                            <div class="btn-group me-2" role="group">
                                <button type="button" class="btn btn-outline-secondary" id="btn-unordered-list" title="Sırasız Liste">
                                    <i class="fas fa-list-ul"></i>
                                </button>
                                <button type="button" class="btn btn-outline-secondary" id="btn-ordered-list" title="Sıralı Liste">
                                    <i class="fas fa-list-ol"></i>
                                </button>
                                <button type="button" class="btn btn-outline-secondary" id="btn-increase-list-indent" title="Liste Girintisini Artır">
                                    <i class="fas fa-level-down-alt fa-rotate-90"></i>
                                </button>
                                <button type="button" class="btn btn-outline-secondary" id="btn-decrease-list-indent" title="Liste Girintisini Azalt">
                                    <i class="fas fa-level-up-alt fa-rotate-90"></i>
                                </button>
                            </div>
                            
                            <!-- Girinti -->
                            <div class="btn-group me-2" role="group">
                                <button type="button" class="btn btn-outline-secondary" id="btn-indent" title="Girintiyi Artır">
                                    <i class="fas fa-indent"></i>
                                </button>
                                <button type="button" class="btn btn-outline-secondary" id="btn-outdent" title="Girintiyi Azalt">
                                    <i class="fas fa-outdent"></i>
                                </button>
                            </div>
                            
                            <!-- Resim İşlemleri -->
                            <div class="btn-group me-2" role="group">
                                <button type="button" class="btn btn-outline-secondary" id="btn-insert-image" title="Resim Ekle">
                                    <i class="fas fa-image"></i>
                                </button>
                            </div>
                            
                            <!-- Tablo İşlemleri -->
                            <div class="btn-group me-2" role="group">
                                <button type="button" class="btn btn-outline-secondary" id="btn-insert-table" title="Tablo Ekle">
                                    <i class="fas fa-table"></i>
                                </button>
                            </div>
                            
                            
                            <!-- Font Boyutu -->
                            <div class="btn-group me-2" role="group">
                                <select class="form-select" id="fontSize">
                                    <option value="3">Normal</option>
                                    <option value="1">Küçük</option>
                                    <option value="2">Orta</option>
                                    <option value="4">Büyük</option>
                                    <option value="5">Çok Büyük</option>
                                    <option value="6">Extra Büyük</option>
                                    <option value="7">En Büyük</option>
                                </select>
                            </div>
                            
                            <!-- Font Ailesi -->
                            <div class="btn-group me-2" role="group">
                                <select class="form-select" id="fontFamily">
                                    <option value="Arial, sans-serif">Arial</option>
                                    <option value="'Times New Roman', serif">Times New Roman</option>
                                    <option value="'Courier New', monospace">Courier New</option>
                                    <option value="Georgia, serif">Georgia</option>
                                    <option value="Verdana, sans-serif">Verdana</option>
                                    <option value="'Trebuchet MS', sans-serif">Trebuchet MS</option>
                                </select>
                            </div>
                            
                            <!-- Biçimlendirme Temizleme -->
                            <div class="btn-group me-2" role="group">
                                <button type="button" class="btn btn-outline-secondary" id="btn-clear-format" title="Biçimlendirmeyi Temizle">
                                    <i class="fas fa-remove-format"></i>
                                </button>
                                <button type="button" class="btn btn-outline-danger" id="btn-clear" title="Editörü Temizle">
                                    <i class="fas fa-eraser"></i>
                                </button>
                            </div>

                            <!-- HTML Görüntüleme ve Önizleme -->
                            <div class="btn-group me-2" role="group">
                                <button type="button" class="btn btn-outline-primary" id="btn-html-view" title="HTML Kodunu Görüntüle">
                                    <i class="fas fa-code"></i>
                                </button>
                                <button type="button" class="btn btn-outline-success" id="btn-html-preview" title="HTML Önizleme">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                            <!-- Editör Modu Göstergesi (Sağ Tarafa Hizalı) -->
                            <div class="ms-auto">
                                <span id="editor-mode-indicator" class="badge bg-secondary d-none">HTML Modu</span>
                            </div>
                        </div>

                        <!-- Resim Araç Çubuğu -->
<div class="btn-toolbar d-none" id="image-toolbar" role="toolbar">
    <div class="btn-group me-2" role="group">
        <button type="button" class="btn btn-outline-secondary" id="img-align-none" title="Normal Görünüm">
            <i class="fas fa-align-justify"></i>
        </button>
        <button type="button" class="btn btn-outline-secondary" id="img-align-left" title="Sola Hizala">
            <i class="fas fa-align-left"></i>
        </button>
        <button type="button" class="btn btn-outline-secondary" id="img-align-center" title="Ortala">
            <i class="fas fa-align-center"></i>
        </button>
        <button type="button" class="btn btn-outline-secondary" id="img-align-right" title="Sağa Hizala">
            <i class="fas fa-align-right"></i>
        </button>
    </div>
    
    <div class="btn-group me-2" role="group">
        <div class="input-group input-group-sm">
            <span class="input-group-text">Boyut</span>
            <input type="number" class="form-control" id="img-width" placeholder="Genişlik" style="width: 80px;">
            <span class="input-group-text">×</span>
            <input type="number" class="form-control" id="img-height" placeholder="Yükseklik" style="width: 80px;">
            <div class="input-group-text">
                <div class="form-check form-check-inline mb-0">
                    <input class="form-check-input" type="checkbox" id="img-lock-ratio" checked>
                    <label class="form-check-label" for="img-lock-ratio"><i class="fas fa-link"></i></label>
                </div>
            </div>
        </div>
    </div>
    
    <div class="btn-group me-2" role="group">
        <button type="button" class="btn btn-outline-secondary" id="img-original" title="Orijinal Boyut">
            <i class="fas fa-undo"></i>
        </button>
    </div>
    
    <div class="btn-group me-2" role="group">
        <input type="text" class="form-control form-control-sm" id="img-alt" placeholder="Alternatif Metin" style="width: 150px;">
    </div>
    
    <div class="btn-group ms-auto" role="group">
        <button type="button" class="btn btn-outline-danger" id="img-remove" title="Resmi Kaldır">
            <i class="fas fa-trash"></i>
        </button>
    </div>
</div>
<!-- index.html dosyasında, image-toolbar'dan sonra ve card-body'den önce ekleyin -->

<!-- Tablo Araç Çubuğu -->
<div class="btn-toolbar d-none" id="table-toolbar" role="toolbar">
    <!-- Satır İşlemleri -->
    <div class="btn-group me-2" role="group">
        <button type="button" class="btn btn-outline-secondary" id="table-row-above" title="Üste Satır Ekle">
            <i class="fas fa-plus-circle"></i> Üste Satır
        </button>
        <button type="button" class="btn btn-outline-secondary" id="table-row-below" title="Alta Satır Ekle">
            <i class="fas fa-plus-circle"></i> Alta Satır
        </button>
        <button type="button" class="btn btn-outline-danger" id="table-row-delete" title="Satırı Sil">
            <i class="fas fa-trash"></i> Satır Sil
        </button>
    </div>
    
    <!-- Sütun İşlemleri -->
    <div class="btn-group me-2" role="group">
        <button type="button" class="btn btn-outline-secondary" id="table-col-left" title="Sola Sütun Ekle">
            <i class="fas fa-plus-circle"></i> Sola Sütun
        </button>
        <button type="button" class="btn btn-outline-secondary" id="table-col-right" title="Sağa Sütun Ekle">
            <i class="fas fa-plus-circle"></i> Sağa Sütun
        </button>
        <button type="button" class="btn btn-outline-danger" id="table-col-delete" title="Sütunu Sil">
            <i class="fas fa-trash"></i> Sütun Sil
        </button>
    </div>
    
    <!-- Hücre İşlemleri -->
    <div class="btn-group me-2" role="group">
        <button type="button" class="btn btn-outline-secondary" id="table-cell-merge" title="Hücreleri Birleştir">
            <i class="fas fa-object-group"></i> Birleştir
        </button>
        <button type="button" class="btn btn-outline-secondary" id="table-cell-split" title="Hücreyi Böl">
            <i class="fas fa-object-ungroup"></i> Böl
        </button>
        <div class="btn-group" role="group">
            <button type="button" class="btn btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                <i class="fas fa-align-center"></i> Hizala
            </button>
            <ul class="dropdown-menu">
                <li><button class="dropdown-item" id="table-align-left"><i class="fas fa-align-left"></i> Sola</button></li>
                <li><button class="dropdown-item" id="table-align-center"><i class="fas fa-align-center"></i> Ortala</button></li>
                <li><button class="dropdown-item" id="table-align-right"><i class="fas fa-align-right"></i> Sağa</button></li>
            </ul>
        </div>
    </div>
    
    <!-- Tablo Stilleri -->
    <div class="btn-group me-2" role="group">
        <div class="btn-group" role="group">
            <button type="button" class="btn btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                <i class="fas fa-palette"></i> Tablo Stili
            </button>
            <ul class="dropdown-menu">
                <li><button class="dropdown-item" id="table-style-default">Varsayılan</button></li>
                <li><button class="dropdown-item" id="table-style-bordered">Kenarlıklı</button></li>
                <li><button class="dropdown-item" id="table-style-striped">Zebra Desenli</button></li>
                <li><button class="dropdown-item" id="table-style-minimal">Minimal</button></li>
            </ul>
        </div>
    </div>
    
    <!-- Tablo Silme -->
    <div class="btn-group ms-auto" role="group">
        <button type="button" class="btn btn-outline-danger" id="table-delete" title="Tabloyu Sil">
            <i class="fas fa-trash"></i> Tabloyu Sil
        </button>
    </div>
</div>
                    </div>
                    
                    <div class="card-body">
                        <!-- Editör Alanı -->
                        <div id="editor" class="form-control" contenteditable="true"></div>
                    </div>

                    
                </div>

                <div class="card mt-3 d-none" id="html-output-card">
                    <div class="card-header">HTML Çıktısı</div>
                    <div class="card-body">
                        <pre id="html-output" class="bg-light p-3" style="white-space: pre-wrap; word-wrap: break-word;"></pre>  
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Özel JavaScript -->
    <script type="module" src="js/editor.js"></script>
    <script>
        // Sayfa tamamen yüklendiğinde ek kontroller
        window.addEventListener('load', function() {
            // Sayfa yüklendikten sonra tüm resimleri seçili durumdan çıkar
            const images = document.querySelectorAll('.editor-image');
            images.forEach(img => {
                img.classList.remove('selected-image');
            });
            
            // Tüm resize handle'ları temizle
            const handles = document.querySelectorAll('.resize-handles');
            handles.forEach(handle => {
                if (handle.parentNode) {
                    handle.parentNode.removeChild(handle);
                }
            });
            
            // Düzgün konumlandırma için scroll olayını dinle
            window.addEventListener('scroll', function() {
                // Açık olan resize handle'lar varsa yeniden konumlandır
                if (typeof window.ImageResize !== 'undefined' && 
                    typeof window.ImageResize.positionResizeHandles === 'function') {
                    window.ImageResize.positionResizeHandles();
                }
            });
        });

        // DOM Elements kısmına ekleyin:
        
        // Buton olaylarında, resim ekleme butonundan sonra:
        // Tablo Ekleme Butonu
        
    </script>
</body>
</html>
